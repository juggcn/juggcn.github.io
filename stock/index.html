<!doctype html>
<!--
  周线红 · 单文件 Web 版
  由 Flutter 工程 juggcn/etf_weekly 移植：主趋势线 EMA(EMA(CLOSE,10),10)，
  日/周双级别、周线为红入选、按周线连红升序。算法与筛选口径与原 App 一致。
  数据：新浪财经（JSONP 日线 + 标的表）、腾讯行情（前复权日线 + 批量现价）。
  全部逻辑内联，无外部依赖；扫描结果按「已收盘周五」缓存在 localStorage。
  自检：在本文件地址后加 #test 打开，可跑 51 项算法/聚合/解析用例。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1113">
<title>周线红 · ETF/股票 日线与周线主趋势线</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F1113; --card:#15181B; --card2:#1B1F23; --line:#23272B;
  --txt:#E9ECEF; --txt2:#B9BFC4; --dim:#8B9196;
  --up:#E24B4A; --down:#1FA97A; --flat:#9AA0A6; --warn:#EF9F27; --down2:#1FA97A;
  --radius:12px;
}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  display:flex; justify-content:center;
  overflow:hidden;
}
#app{
  width:100%; max-width:560px; height:100dvh; display:flex; flex-direction:column;
  position:relative; background:var(--bg);
}
@media (min-width:600px){
  body{background:#08090A}
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:0}
input{font-family:inherit}
.hidden{display:none!important}

/* ---------- 顶栏 ---------- */
.top{
  display:flex;align-items:center;gap:8px;padding:10px 12px 8px;
  background:#16181A;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand .t{font-size:17px;font-weight:600;letter-spacing:.5px}
.brand .s{font-size:10.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:2px}
.acts button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;position:relative;color:#fff}
.acts button:active{background:#23272B}
.acts button:disabled{opacity:.35}
.acts svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts .on{color:var(--warn)}
.badge{
  position:absolute;top:2px;right:1px;min-width:14px;height:14px;padding:0 3px;
  background:var(--up);color:#fff;font-size:9px;line-height:14px;text-align:center;
  border-radius:7px;font-weight:600;
}

/* ---------- 状态卡 ---------- */
.status{
  margin:10px 10px 4px;padding:11px 12px;background:var(--card);border-radius:var(--radius);
  flex:0 0 auto;
}
.status .r1{display:flex;align-items:center;gap:8px}
.status .title{font-size:14px;font-weight:500}
.status .right{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.live{background:var(--up);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--up);transition:width .25s}
.status .sub{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.status .warn{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
.status .warn .lnk{color:var(--up);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* ---------- 数据源条 ---------- */
.srcbar{
  display:flex;align-items:center;gap:6px;padding:2px 14px 8px;font-size:11px;color:var(--dim);
  flex:0 0 auto;
}
.srcbar .val{color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcbar .grow{flex:1}
.sdots{display:flex;gap:5px;align-items:center}
.sd{width:6px;height:6px;border-radius:50%;background:#3A4046}
.sd.ok{background:#1FA97A}.sd.cool{background:var(--warn)}

/* ---------- 筛选 ---------- */
.filters{flex:0 0 auto}
.frow{display:flex;gap:6px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:28px;padding:0 10px;border-radius:14px;background:var(--card2);
  border:.8px solid var(--line);color:var(--txt2);font-size:12px;display:flex;align-items:center;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
}
.chip.on{background:rgba(226,75,74,.16);border-color:rgba(226,75,74,.6);color:var(--up)}
.chip .n{opacity:.8;margin-left:2px}
.chip.lbl{background:none;border:0;color:var(--dim);padding:0 2px 0 0;cursor:default}
.sep{height:1px;background:var(--line);flex:0 0 auto;margin:2px 0 0}

/* ---------- 列表 ---------- */
.list{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 10px 96px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.card{
  background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:6px;
  cursor:pointer;transition:background .12s;
}
.card:active{background:#191D20}
.card .r1{display:flex;align-items:flex-start;gap:6px}
.card .name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.star-i{color:var(--warn);font-size:12px;line-height:1.3;flex:0 0 auto}
.pill{
  flex:0 0 auto;padding:2px 5px;border-radius:4px;font-size:10.5px;line-height:1.25;
  background:rgba(139,145,150,.15);color:var(--dim);
}
.pill.up{background:rgba(226,75,74,.15);color:var(--up)}
.pill.dn{background:rgba(31,169,122,.15);color:var(--down)}
.card .r2{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:11px;color:var(--dim)}
.card .r2 .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:9.5px;padding:1px 5px;border-radius:4px;background:rgba(239,159,39,.16);color:var(--warn);flex:0 0 auto}
.card .r3{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.px{font-size:15px;font-weight:500}
.pct{font-size:12px}
.card .r3 .grow{flex:1}
.card .r3 .wkp{font-size:11px}
.card .r3 .wlv{font-size:11px;color:var(--dim)}
.card .r4{display:flex;gap:0;margin-top:4px;font-size:10px;color:var(--dim)}
.card .r4 .dotsep{margin:0 6px;color:#4A5056}
.card .r4 .b{color:var(--dim)}
.up{color:var(--up)}.dn{color:var(--down)}.flat{color:var(--flat)}
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 40px;color:var(--dim);font-size:12px;text-align:center;line-height:1.7;
}
.empty svg{width:34px;height:34px;stroke:var(--dim);fill:none;stroke-width:1.5;margin-bottom:10px}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:16px;bottom:20px;height:46px;padding:0 18px;border-radius:23px;
  background:var(--up);color:#fff;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(226,75,74,.32);
  z-index:20;
}
.fab.stop{background:#2A2E33;box-shadow:none}
.fab svg{width:16px;height:16px;fill:currentColor;stroke:none}

/* ---------- 详情 ---------- */
.detail{
  position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;
  animation:slidein .18s ease-out;
}
@keyframes slidein{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
.dtop{display:flex;align-items:center;gap:4px;padding:8px 8px;background:#16181A;border-bottom:1px solid var(--line);flex:0 0 auto}
.dtop .ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.dtop .ico:active{background:#23272B}
.dtop svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dtitle{flex:1;min-width:0;display:flex;align-items:center}
.dtitle .tbox{flex:1;min-width:0;text-align:center}
.dtitle .nrow{display:flex;align-items:center;justify-content:center;gap:4px}
.dtitle .n{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74%}
.dtitle .ico.nav{width:22px;height:22px;flex:0 0 auto;color:#8B9196}
.dtitle .ico.nav svg{width:17px;height:17px}
.dtitle .m{font-size:10.5px;color:var(--dim);margin-top:1px}
.dtitle .m b{font-weight:400;color:var(--txt2)}
.dbody{flex:1;overflow-y:auto;padding:12px 12px 28px}
.dchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lvchip{font-size:11px;padding:3px 8px;border-radius:5px;background:rgba(139,145,150,.15);color:var(--dim)}
.lvchip.up{background:rgba(226,75,74,.15);color:var(--up)}
.lvchip.dn{background:rgba(31,169,122,.15);color:var(--down)}
.tag{font-size:10px;padding:2px 5px;border-radius:4px;background:rgba(139,145,150,.14);color:var(--dim)}
.tag.live{background:rgba(226,75,74,.12);color:var(--up)}
.grow{flex:1}
.tabs{display:flex;gap:4px}
.tab{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--card2);border:.8px solid var(--line);color:var(--txt2)}
.tab.on{background:rgba(226,75,74,.16);border-color:rgba(226,75,74,.6);color:var(--up)}
.chartbox{
  position:relative;height:390px;margin-top:8px;background:var(--card);border-radius:var(--radius);
  padding:8px 6px 4px;overflow:hidden;
}
.chartbox canvas{width:100%;height:100%;display:block;touch-action:none}
.tip{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 24px;text-align:center;font-size:12px;color:var(--dim);pointer-events:none;
}
.tip.hidden{display:none}
.panel{margin-top:10px;padding:10px 12px;background:var(--card);border-radius:var(--radius)}
.prow{display:flex;align-items:center;padding:4px 0;font-size:12px}
.prow .k{color:var(--dim)}
.prow .v{margin-left:auto;font-size:13px;color:#fff}
/* 下面几条必须带上 .prow .v 前缀：单类 .up/.dn 特异性低，会被上面的 .prow .v 吃掉颜色 */
.prow .v.up{color:var(--up)}
.prow .v.dn{color:var(--down)}
.prow .v.flat{color:var(--flat)}
.prow .v.t2{color:var(--txt2)}
.pdiv{height:1px;background:var(--line);margin:4px 0}
.note{font-size:11px;color:var(--dim);line-height:1.65;margin:12px 2px 0}

/* ---------- 弹层 ---------- */
.sheet{
  position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet .box{
  width:100%;max-width:560px;max-height:82%;background:#191C1F;border-radius:14px 14px 0 0;
  padding:14px 14px 22px;overflow-y:auto;animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 10px;font-size:15px;font-weight:500}
.sheet .desc{font-size:11.5px;color:var(--dim);line-height:1.7;margin-bottom:10px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.srow:first-of-type{border-top:0}
.srow .grow{flex:1;min-width:0}
.srow .nm{font-size:13px}
.srow .sub{font-size:10.5px;color:var(--dim);margin-top:1px}
.srow .num{font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
.pick{width:16px;height:16px;border-radius:8px;border:1.5px solid #3A4046;flex:0 0 auto}
.pick.on{border-color:var(--up);background:var(--up);box-shadow:inset 0 0 0 3px #191C1F}
.searchbar{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:38px;margin-bottom:10px}
.searchbar input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px}
.searchbar input::placeholder{color:#6B7075}
.sres{max-height:52vh;overflow-y:auto}
.sitem{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #202427;cursor:pointer;font-size:13px}
.sitem .c{color:var(--dim);font-size:11px;width:52px;flex:0 0 auto}
.sitem .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem:active{background:#1F2327}
.btn{height:36px;border-radius:9px;padding:0 14px;font-size:13px;background:var(--card2);border:1px solid var(--line);color:var(--txt2)}
.btn.pri{background:var(--up);border-color:var(--up);color:#fff}
.toast{
  position:absolute;left:50%;bottom:86px;transform:translateX(-50%);
  background:#2E3439;color:#F2F4F5;font-size:12.5px;padding:8px 14px;border-radius:8px;
  z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="t">周线红</span>
      <span class="s">ETF / 股票 · 日线与周线主趋势线</span>
    </div>
    <div class="acts">
      <button id="bSearch" title="搜索标的">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      </button>
      <button id="bRefresh" title="刷新（重算已命中标的）" disabled>
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
      <button id="bStar" title="我的自选">
        <svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.5 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.9l5.9-.8z"/></svg>
        <span class="badge hidden" id="starN">0</span>
      </button>
      <button id="bMore" title="口径说明">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6"/><circle cx="12" cy="7.6" r=".9" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <section class="status">
    <div class="r1">
      <span class="title" id="stTitle">尚未扫描</span>
      <span class="grow"></span>
      <span class="right" id="stRight"></span>
    </div>
    <div class="progress hidden" id="stBarWrap"><i id="stBar"></i></div>
    <div class="sub" id="stSub">周线为红才入选 · 按周线连红升序</div>
    <div class="warn hidden" id="stWarn"></div>
  </section>

  <div class="srcbar" id="srcBar">
    <span>数据源</span>
    <span class="val" id="srcVal">自动选择</span>
    <span class="grow"></span>
    <span class="sdots" id="srcDots"></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B9196" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <div class="filters">
    <div class="frow" id="frow1"></div>
    <div class="frow" id="frow2"></div>
  </div>
  <div class="sep"></div>

  <div class="list" id="list"></div>

  <button class="fab" id="fab">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span id="fabTxt">开始扫描</span>
  </button>

  <!-- 详情页 -->
  <div class="detail hidden" id="detail">
    <header class="dtop">
      <button class="ico" id="dBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dtitle">
        <div class="tbox">
          <div class="nrow">
            <button class="ico nav" id="dPrev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <span class="n" id="dName">--</span>
            <button class="ico nav" id="dNext"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <div class="m" id="dMeta">--</div>
        </div>
      </div>
      <button class="ico" id="dStar"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.5 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.9l5.9-.8z"/></svg></button>
    </header>
    <div class="dbody" id="dBody">
      <div class="dchips">
        <span class="lvchip" id="chipW">周线 --</span>
        <span class="tag hidden" id="tagPartial">本周未收盘</span>
        <span class="lvchip" id="chipD">日线 --</span>
        <span class="tag live hidden" id="tagLive">含实时</span>
        <span class="grow"></span>
        <span class="tabs">
          <button class="tab on" id="tabW">周K</button>
          <button class="tab" id="tabD">日K</button>
        </span>
      </div>
      <div class="chartbox">
        <canvas id="chart"></canvas>
        <div class="tip" id="tip"></div>
      </div>
      <div class="panel" id="dPanel"></div>
      <p class="note">
        点按任意一根 K 线查看明细；双指捏合或滚轮缩放，放大后可横向拖动查看更早的行情。<br>
        顶部两行为该根的日期、开高低收、涨跌、量额与趋势值。<br>
        主趋势线 = EMA(EMA(CLOSE,10),10)，通达信口径，逐段红绿；本周未走完时末根与趋势线段为虚线。<br>
        周线由日线本地聚合，两个级别同源；开盘后当日那根 K 就是实时价。<br>
        本工具只做形态筛选，不构成投资建议。
      </p>
    </div>
  </div>

  <!-- 弹层容器 -->
  <div class="sheet hidden" id="sheet"><div class="box" id="sheetBox"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* =====================================================================
 * 周线红 · 单文件 Web 版
 * 从 Flutter 工程（lib/core/trend.dart、filter.dart、scanner.dart、
 * data/quote_api.dart 等）逐条移植，口径与原 App 保持一致：
 *   主趋势线 = EMA(EMA(CLOSE,10),10)，通达信算法
 *   周线由日线聚合，周线为红才入选，按周线连红升序、同档成交额降序
 * ===================================================================== */
var WR = (function () {
  'use strict';

  /* ------------------------------ 常量 ------------------------------ */
  var KMIN = 40;          // 双向 EMA10 约 40 根收敛
  var CONC = 6;           // 并发（JSONP 走 <script>，可比 App 的 8 稍低）
  var TICK_MS = 5000;     // 盘中现价刷新间隔

  /* ------------------------------ 日期 ------------------------------ */
  function d2(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function wd(d) { return (d.getDay() + 6) % 7 + 1; }           // 周一=1 … 周日=7
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function monday0(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - (wd(x) - 1)); return x;
  }
  function at15(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 15, 0, 0, 0); }
  function sameWeek(a, b) { return monday0(a).getTime() === monday0(b).getTime(); }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  /** 最近一个已收盘周五（缓存按周切分用） */
  function anchorFriday(now) {
    var f = addDays(at15(now), 5 - wd(now));
    if (now < f) f = addDays(f, -7);
    return new Date(f.getFullYear(), f.getMonth(), f.getDate());
  }

  /** 本周是否还没收盘（周一至周五 15:00 前） */
  function weekOpen(now) {
    if (wd(now) > 5) return false;

  /* ---------------------------- 趋势算法 ---------------------------- */

   * 连红 = 从末根往前数 e2 连续大于前一根的根数。
   * lastOverride 非空时替换末根收盘价（实时价口径）。
   */
  function analyzeSeries(closes, lastOverride, withLine) {
    var n = closes.length;
    if (n < KMIN) return null;
    var live = (lastOverride != null && lastOverride > 0);
    var line = withLine ? new Array(n).fill(0) : null;
    var e1 = 0, e2 = 0, prevE2 = 0, lastE2 = 0, prevLastE2 = 0, streak = 0, last = 0;
    for (var i = 0; i < n; i++) {
      var x = (live && i === n - 1) ? lastOverride : closes[i];
      e1 = i === 0 ? x : (2 * x + 9 * e1) / 11;
      e2 = i === 0 ? e1 : (2 * e1 + 9 * e2) / 11;
      if (i > 0) streak = e2 > prevE2 ? streak + 1 : 0;
      if (line) line[i] = e2;
      prevE2 = e2;
      prevLastE2 = lastE2;
      lastE2 = e2;
      if (i === n - 1) last = x;
    }
    var prev = closes[n - 2];
    return {
      line: line || [],
      redWeeks: streak,
      value: lastE2,
      prevValue: prevLastE2,
      lastClose: last,
      weekPct: prev === 0 ? 0 : (last - prev) / prev * 100,
      isRed: streak > 0,
      bias: lastE2 === 0 ? 0 : (last - lastE2) / lastE2 * 100

  function analyzeBars(bars) { return analyzeCloses(bars.map(function (b) { return b.c; })); }

  /** 从「周 -> 当周入选集合」算连续入选周数：断一周归零 */

      alive.forEach(function (c) { out[c] = (out[c] || 0) + 1; });

  /* --------------------------- 标的分类 --------------------------- */

  /* --------------------------- 数据源健康 --------------------------- */
  var SRC = {

      var timer = setTimeout(function () { finish(new Error('超时')); }, timeout);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      function finish(err, data) {
        if (done) return;
        done = true; cleanup();

      }
      window[name] = function (data) { finish(null, data); };
      s.onerror = function () { finish(new Error('网络错误')); };

  /** 全市场标的表：ETF + 沪深主板（剔除债、货币、ST/退市） */

    var nodes = ['etf_hq_fund', 'hs_a'];
    var map = new Map();
    for (var ni = 0; ni < nodes.length; ni++) {
      var node = nodes[ni];
      var total = await sinaNodeCount(node);
      var pages = total > 0 ? Math.min(120, Math.ceil(total / 100)) : 40;
      for (var p = 1; p <= pages; p += 4) {
        var idx = [];
        for (var i = p; i < p + 4 && i <= pages; i++) idx.push(i);
        var res = await Promise.all(idx.map(function (n) { return sinaPage(node, n); }));
        for (var k = 0; k < res.length; k++) {
          var rows = res[k];
          if (!rows.length && idx[k] <= pages) {
            await sleep(120);
            rows = await sinaPage(node, idx[k]);
          }
          for (var r = 0; r < rows.length; r++) {
            var f = fundFromSina(rows[r]);
            if (f && !map.has(f.code)) map.set(f.code, f);
          }
        }
        if (onProgress) onProgress(map.size);
      }
    }
    return Array.from(map.values());

  /**
   * 扫描一轮
   * @param pool 标的数组
   * @param ctl { cancelled, onTick(done,total,failed,gaps,stage) }
   */
  async function scan(pool, ctl) {
    var found = [], all = [], failedFunds = [], gaps = 0, failed = 0;
    var cursor = 0, done = 0, consecFail = 0, lastOk = Date.now(), pauseUntil = 0;
    var now = new Date();
    var workers = [];
    for (var w = 0; w < CONC; w++) {
      workers.push((async function () {
        while (true) {
          if (ctl.cancelled()) return;
          if (pauseUntil > Date.now()) {
            await sleep(Math.min(pauseUntil - Date.now(), 15000));
            if (ctl.cancelled()) return;
          }
          var i = cursor++;
          if (i >= pool.length) return;
          var f = pool[i];
          try {
            var r = await withTimeout(fetchBoth(f, now), 20000);
            var hit = hitOf(f, r, now);
            all.push(hit);
            if (hit.weekly && hit.weekly.isRed) found.push(hit);
            consecFail = 0; lastOk = Date.now();
          } catch (e) {
            if (e && e.gap) gaps++;
            else {
              failed++; consecFail++;
              failedFunds.push(f);
              var sec = backoffSeconds(consecFail);
              if (sec > 0) { pauseUntil = Date.now() + sec * 1000; consecFail = 0; }
              if (failed >= 40 && Date.now() - lastOk > 60000) ctl.abort && ctl.abort();
            }
          }
          done++;
          if (ctl.onTick && done % 5 === 0) ctl.onTick(done, pool.length, failed, gaps);
          await sleep(consecFail > 0 ? 120 : 25);
        }
      })());
    }
    await Promise.all(workers);
    return { found: found, all: all, failed: failed, gaps: gaps, failedFunds: failedFunds };
  }

  function backoffSeconds(consec) {
    if (consec === 1) return 0;
    if (consec === 2) return 2;
    if (consec === 3) return 4;
    if (consec === 4) return 8;
    if (consec >= 5) return 15;
    return 0;
  }

  }

  /* ------------------------- 筛选 / 排序 ------------------------- */
  function selectHits(hits, opt) {
    opt = opt || {};
    var kind = opt.kind || '全部', minAmount = opt.minAmount || 0, minWeekRed = opt.minWeekRed || 1;
    var bothRed = !!opt.bothRed;
    var weeklyLive = opt.weeklyLive || {}, dailyLive = opt.dailyLive || {};
    var newCodes = opt.newCodes || new Set(), streaks = opt.streaks || {};
    var list = [];
    for (var i = 0; i < hits.length; i++) {
      var h = hits[i];
      if (isExcluded(h.fund)) continue;
      var w = weeklyLive[h.fund.code] || h.weekly;
      var d = dailyLive[h.fund.code] || h.daily;
      if (!(w && w.isRed)) continue;
      if (kind !== '全部' && h.fund.kind !== kind) continue;
      if (h.fund.amount < minAmount) continue;
      if (bothRed && !(w.isRed && d && d.isRed)) continue;
      if ((w.redWeeks || 0) < minWeekRed) continue;
      list.push({
        fund: h.fund, daily: d, weekly: w, weekPartial: h.weekPartial,
        wCloses: h.wCloses, wSlope: h.wSlope, volRatio: h.volRatio,
        newHit: newCodes.has(h.fund.code), streak: streaks[h.fund.code] || 0,
        weekRed: w.redWeeks || 0, dayRed: d ? d.redWeeks : 0,
        bias: w.bias || 0, amount: h.fund.amount
      });
    }
    list.sort(function (a, b) {
      if (a.weekRed !== b.weekRed) return a.weekRed - b.weekRed;
      return b.amount - a.amount;
    });
    return list;
  }

    var newCodes = new Set(), dropped = [], comparable = !!(cur && last);
    if (comparable) {

      var lastSet = new Set(last.items.map(function (x) { return x[0]; }));
      curSet.forEach(function (c) { if (!lastSet.has(c)) newCodes.add(c); });

    SRC: SRC, order: order, srcStats: srcStats, setManual: setManual, resetSources: resetSources,
    getManual: function () { return manual; }, getLastUsed: function () { return lastUsed; },
    probe: probe, getPrefer: function () { return prefer; },
    // 存储
    lsGet: lsGet, lsSet: lsSet, loadWatch: loadWatch, saveWatch: saveWatch,
    loadHist: loadHist, saveHist: saveHist, recordRound: recordRound, histView: histView,
    saveCache: saveCache, loadCache: loadCache,
    // 其他
    scan: scan, selftest: selftest, chartIndexAt: chartIndexAt, sleep: sleep
  };
})();
</script>
<script>
/* =====================================================================
 * 界面层：列表 / 筛选 / 详情 K 线 / 自选 / 数据源 / 本地缓存
 * 交互与原 App（ui/home_page.dart、detail_page.dart、chart.dart）对齐
 * ===================================================================== */
(function () {
  'use strict';
  var W = WR;
  var $ = function (id) { return document.getElementById(id); };

  var state = {
    hits: [],
    universe: [],
    updatedAt: null,
    universeSize: 0,

    running: false,
    cancelled: false,
    prog: { done: 0, total: 0, failed: 0, gaps: 0, stage: '' },

    live: {},
    wkLive: {},
    dyLive: {},
    liveAt: null,
    liveTimer: null,
    liveBusy: false,
    liveRetryAfter: 0,

    kind: '全部',
    minAmount: 0,
    minRed: 1,
    bothRed: false,
    onlyNew: false,
    showDropped: false,
    starOnly: false,

    hist: null,
    watch: [],

    detail: null
  };

  /* ------------------------------ 基础 ------------------------------ */
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function starCodes() {
    var s = new Set();
    state.watch.forEach(function (f) { s.add(f.code); });
    return s;
  }

  function liveQuote(code, now) {
    var q = state.live[code];
    if (!q) return null;
    if (q.time && !W.sameDay(q.time, now || new Date())) return null; // 隔日的不算实时
    return q;
  }

  /** 命中数：排除债券货币，周线按实时价重算后仍为红 */
  function hitCount() {
    var n = 0;
    state.hits.forEach(function (h) {
      if (W.isExcluded(h.fund)) return;
      var w = state.wkLive[h.fund.code] || h.weekly;
      if (w && w.isRed) n++;
    });
    return n;
  }

  function weekStale() {
    if (!state.updatedAt) return false;
    return W.fmt(W.anchorFriday(state.updatedAt)) !== W.fmt(W.anchorFriday(new Date()));
  }
  function daysOld() {
    if (!state.updatedAt) return 0;
    var a = new Date(), b = state.updatedAt;
    return Math.round((new Date(a.getFullYear(), a.getMonth(), a.getDate()) - new Date(b.getFullYear(), b.getMonth(), b.getDate())) / 86400000);
  }

  /* ------------------------------ 列表行 ------------------------------ */
  function currentRows() {
    var hv = W.histView(state.hist);
    if (state.showDropped) {
      return hv.dropped.filter(function (f) {
        return !W.isExcluded(f) && f.kind !== '其它' && (state.minAmount === 0 || f.amount >= state.minAmount);
      }).map(function (f) {
        f.sym = f.sym || W.txSymbol(f);
        return { fund: f, dropped: true, lastWeekRed: f.lastWeekRed, weekRed: 0, dayRed: 0 };
      });
    }
    if (state.starOnly) {
      var byCode = {};
      state.hits.forEach(function (h) { byCode[h.fund.code] = h; });
      return state.watch.filter(function (f) {
        return !W.isExcluded(f) && f.kind !== '其它' && (state.minAmount === 0 || f.amount >= state.minAmount);
      }).map(function (f) {
        var h = byCode[f.code];
        f.sym = f.sym || W.txSymbol(f);
        var w = h ? (state.wkLive[f.code] || h.weekly) : null;
        var d = h ? (state.dyLive[f.code] || h.daily) : null;
        return {
          fund: h ? h.fund : f, daily: d, weekly: w,
          weekPartial: h ? h.weekPartial : false,
          wCloses: h ? h.wCloses : [], wSlope: h ? h.wSlope : 0, volRatio: h ? h.volRatio : 0,
          newHit: hv.newCodes.has(f.code), streak: hv.streaks[f.code] || 0,
          weekRed: w ? w.redWeeks : 0, dayRed: d ? d.redWeeks : 0,
          bias: w ? w.bias : 0, amount: h ? h.fund.amount : f.amount
        };
      });
    }
    var rows = W.selectHits(state.hits, {
      kind: state.kind, minAmount: state.minAmount, minWeekRed: state.minRed, bothRed: state.bothRed,
      weeklyLive: state.wkLive, dailyLive: state.dyLive,
      newCodes: hv.newCodes, streaks: hv.streaks
    });
    if (state.onlyNew) rows = rows.filter(function (r) { return r.newHit; });
    return rows;
  }

  function levelPill(label, weeks, red, stale) {
    if (stale) return '<span class="pill">' + label + '?</span>';
    if (red == null) return '<span class="pill">' + label + '</span>';
    return '<span class="pill ' + (red ? 'up' : 'dn') + '">' + (red ? label + weeks : label) + '</span>';
  }

  function cardHTML(r, stars, stale) {
    var f = r.fund;
    var q = liveQuote(f.code, stale.now);
    var price = q ? q.price : f.price;
    var pct = q ? q.pct : f.pct;
    var tr = r.weekly, td = r.daily;
    var starred = stars.has(f.code);
    var staleWeek = stale.week;
    var staleDay = stale.day;
    var scanned = !!(td || tr);

    var h = '<div class="card" data-code="' + W.esc(f.code) + '">';
    h += '<div class="r1">';
    if (starred) h += '<span class="star-i">★</span>';
    h += '<div class="name">' + W.esc(f.name) + '</div>';
    if (!scanned) h += '<span class="pill">未扫描</span>';
    else {
      h += levelPill('日', td ? td.redWeeks : 0, td ? td.isRed : null, staleDay).replace('<span class="pill', '<span data-k="pd" class="pill');
      h += levelPill('周', tr ? tr.redWeeks : 0, tr ? tr.isRed : null, staleWeek).replace('<span class="pill', '<span data-k="pw" class="pill');
    }
    h += '</div>';

    h += '<div class="r2"><div class="grow">' + W.esc(f.code) + ' · ' + W.esc(f.kind) + ' · ' + W.fmtAmount(r.amount) + '</div>';
    if (r.newHit) h += '<span class="mini">新进</span>';
    if (r.streak >= 3) h += '<span style="font-size:10px;color:#8A9299">连续 ' + r.streak + ' 周</span>';
    h += '</div>';

    h += '<div class="r3">';
    h += '<span class="px ' + W.pctClass(pct) + '" data-k="px">' + (price > 0 ? price.toFixed(3) : '--') + '</span>';
    h += '<span class="pct ' + W.pctClass(pct) + '" data-k="pct">' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%</span>';
    h += '<span class="grow"></span>';
    if (r.dropped) {
      h += '<span style="font-size:11px;color:#EE7B4D">已退出 · 上次连红 ' + r.lastWeekRed + ' 周</span>';
    } else if (staleWeek && scanned) {
      h += '<span class="wlv">待重新扫描</span>';
    } else if (tr) {
      h += '<span class="wkp ' + W.pctClass(tr.weekPct) + '" data-k="wkp">本周 ' + (tr.weekPct >= 0 ? '+' : '') + tr.weekPct.toFixed(2) + '%</span>';
      if (r.weekPartial) h += '<span style="font-size:9px;color:#8B9196;margin-left:3px">未收</span>';
      h += '<span class="wlv" style="margin-left:10px" data-k="wlv">周线 ' + tr.value.toFixed(3) + '</span>';
    } else if (!scanned) {
      h += '<span class="wlv">未参与本次扫描</span>';
    }
    h += '</div>';

    if (!r.dropped && tr && !staleWeek) {
      h += '<div class="r4"><span class="' + W.pctClass(r.bias) + '">乖离 ' + W.signed(r.bias, 1) + '%</span>';
      h += '<span class="dotsep">·</span><span class="' + (r.wSlope >= 0 ? 'up' : 'dn') + '">斜率 ' + W.signed(r.wSlope, 2) + '%/周</span>';
      var vr = r.volRatio;
      var vcls = vr >= 1.2 ? 'up' : (vr > 0 && vr < 0.8 ? 'dn' : '');
      h += '<span class="dotsep">·</span><span class="' + vcls + '">量 ' + (vr > 0 ? vr.toFixed(1) + 'x' : '--') + '</span></div>';
    }
    h += '</div>';
    return h;
  }

  function renderList() {
    var rows = currentRows();
    var stars = starCodes();
    var box = $('list');
    state._rows = rows;
    if (!rows.length) {
      box.innerHTML = emptyHTML();
      return;
    }
    // 整页只算一次：weekStale() 内部要走两遍 anchorFriday + fmt，按卡算就是上千次日期运算
    var stale = { week: weekStale(), day: daysOld() > 0, now: new Date() };
    var buf = [];
    for (var i = 0; i < rows.length; i++) buf.push(cardHTML(rows[i], stars, stale));
    box.innerHTML = buf.join('');
  }

  function emptyHTML() {
    var msg, icon;
    if (state.running) {
      msg = '正在逐个拉日线并算周线主趋势线，ETF + 沪深主板股票约 4800 只。';
      icon = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    } else if (state.showDropped) {
      msg = '没有标的退出，上一轮与本轮名单一致。';
      icon = '<svg viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M21 17h-5v-5"/></svg>';
    } else if (state.starOnly) {
      msg = state.watch.length ? '当前成交额条件下没有自选标的。' : '还没有自选。进入任意标的详情，点右上角星标加入。';
      icon = '<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.5 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.9l5.9-.8z"/></svg>';
    } else if (state.onlyNew) {
      msg = '本轮没有新进标的。新进至少需要两轮扫描才能比出来。';
      icon = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
    } else if (!state.hits.length) {
      msg = '点右下角「开始扫描」，对全市场 ETF + 沪深主板股票逐个算周线主趋势线。\n扫描结果按周缓存，同一周内再打开不必重扫。';
      icon = '<svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>';
    } else {
      msg = '当前筛选条件下没有标的，放宽条件试试。';
      icon = '<svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>';
    }
    return '<div class="empty">' + icon + '<div>' + msg.replace(/\n/g, '<br>') + '</div></div>';
  }

  /* ------------------------------ 状态卡 ------------------------------ */
  function p2(n) { return String(n).padStart(2, '0'); }
  function hms(d) {
    return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }
  function mmdd(d) {
    return p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  function renderStatus() {
    var p = state.prog;
    var now = new Date();
    var days = daysOld();
    var title, right = '', sub = '', warn = '';

    if (state.running) {
      title = p.total ? '扫描中 ' + p.done + '/' + p.total : '扫描中…';
      right = '<span>' + (p.total ? Math.round(p.done / p.total * 100) : 0) + '%</span>';
      $('stBarWrap').classList.remove('hidden');
      $('stBar').style.width = (p.total ? p.done / p.total * 100 : 0) + '%';
    } else {
      $('stBarWrap').classList.add('hidden');
      if (state.showDropped) title = '已退出 ' + W.histView(state.hist).dropped.length + ' 只';
      else if (state.starOnly) title = '我的自选 ' + state.watch.length + ' 只';
      else if (!state.updatedAt) title = '尚未扫描';
      else title = '命中 ' + hitCount() + ' / 扫描 ' + state.universeSize;
    }

    if (!state.running) {
      if (state.liveAt) {
        var trading = W.isTrading(now);
        right = '<span class="dot ' + (trading ? 'live' : '') + '"></span><span>' +
          (trading ? '实时 ' : W.session(now) + ' ') + hms(state.liveAt) + '</span>';
      } else if (state.updatedAt) {
        right = '<span>' + mmdd(state.updatedAt) + '</span>';
      }
    }
    $('stTitle').textContent = title;
    $('stRight').innerHTML = right;

    sub = p.stage || (W.isTrading(now)
      ? '开盘：现价、周线、日线全部按实时数据计算'
      : '周线为红才入选 · 按周线连红升序');
    $('stSub').textContent = sub;

    var parts = [];
    if (p.failed > 0) parts.push('<span style="color:#BA7517">取数失败 ' + p.failed + ' 只（已自动重试）</span>');
    if (p.gaps > 0) parts.push('<span>数据不足 ' + p.gaps + ' 只（次新、停牌，K 线不足 40 根）</span>');
    if (!state.running && weekStale()) {
      parts.push('<span style="color:#EF9F27">周线已换周，当前为上一周的旧结果</span>' +
        '<span class="lnk" id="lnkRescan">重新计算</span>');
    } else if (!state.running && days > 0 && state.updatedAt) {
      parts.push('<span style="color:#BA7517">数据为 ' + days + ' 天前，日线颜色可能已变</span>' +
        '<span class="lnk" id="lnkRescan">刷新</span>');
    }
    var warnEl = $('stWarn');
    if (parts.length) { warnEl.innerHTML = parts.join(' &nbsp;'); warnEl.classList.remove('hidden'); }
    else { warnEl.innerHTML = ''; warnEl.classList.add('hidden'); }
    var lnk = $('lnkRescan');
    if (lnk) lnk.onclick = function () { state.hits.length ? refreshHits() : startScan(); };

    $('bRefresh').disabled = state.running || !state.hits.length;
    $('fabTxt').textContent = state.running ? '取消' : (state.hits.length ? '重新扫描' : '开始扫描');
    $('fab').classList.toggle('stop', state.running);
  }

  /* ------------------------------ 筛选条 ------------------------------ */
  function chip(label, on, attrs) {
    return '<button class="chip' + (on ? ' on' : '') + '" ' + (attrs || '') + '>' + label + '</button>';
  }

  function renderFilters() {
    var hv = W.histView(state.hist);
    var r1 = [];
    ['全部', 'ETF', '股票'].forEach(function (k) {
      r1.push(chip(k, state.kind === k && !state.starOnly && !state.showDropped, 'data-act="kind" data-v="' + k + '"'));
    });
    r1.push(chip('自选', state.starOnly, 'data-act="star"'));
    r1.push('<span class="chip lbl">成交额</span>');
    [[0, '不限额'], [5e6, '≥500万'], [2e7, '≥2000万']].forEach(function (e) {
      r1.push(chip(e[1], state.minAmount === e[0], 'data-act="amt" data-v="' + e[0] + '"'));
    });
    $('frow1').innerHTML = r1.join('');

    var r2 = [];
    if (hv.comparable) {
      r2.push(chip('新进 <span class="n">' + hv.newCodes.size + '</span>', state.onlyNew && !state.showDropped, 'data-act="new"'));
      r2.push(chip('退出 <span class="n">' + hv.dropped.length + '</span>', state.showDropped, 'data-act="drop"'));
    }
    if (!state.showDropped) {
      r2.push(chip('双红', state.bothRed, 'data-act="both"'));
      r2.push('<span class="chip lbl">周连红</span>');
      [1, 3, 5, 8].forEach(function (v) {
        r2.push(chip('≥' + v + '周', state.minRed === v, 'data-act="red" data-v="' + v + '"'));
      });
    }
    $('frow2').innerHTML = r2.join('');
    $('frow2').classList.toggle('hidden', state.starOnly);
  }

  /* ------------------------------ 数据源条 ------------------------------ */
  function renderSource() {
    var st = W.srcStats();
    var manual = W.getManual();
    var label = manual ? (W.SRC[manual] ? W.SRC[manual].label : '') : '自动选择';
    var used = W.getLastUsed() ? '　最近：' + W.getLastUsed() : '';
    $('srcVal').textContent = label + used;
    $('srcDots').innerHTML = st.map(function (s) {
      var cls = s.cooling ? 'cool' : (s.sample === 0 ? '' : (s.rate >= 0.8 ? 'ok' : 'cool'));
      return '<i class="sd ' + cls + '" title="' + s.label + '"></i>';
    }).join('');
  }

  /* ------------------------------ 渲染总入口 ------------------------------ */
  function render() {
    renderStatus();
    renderFilters();
    renderSource();
    renderList();
    var n = state.watch.length;
    var b = $('starN');
    b.textContent = n;
    b.classList.toggle('hidden', n === 0 || state.starOnly);
    $('bStar').classList.toggle('on', state.starOnly);
  }

  /* ------------------------------ 启动 ------------------------------ */
  async function boot() {
    state.hist = W.loadHist();
    state.watch = W.loadWatch().map(function (f) { f.sym = f.sym || W.txSymbol(f); return f; });

    var cached = W.loadCache(new Date());
    if (cached && cached.hits.length) {
      state.hits = cached.hits;
      state.updatedAt = cached.ts;
      state.universeSize = cached.n;
      state.prog.stage = '已载入本周缓存（' + W.fmt(cached.ts).slice(5) + ' 扫描）';
    }
    render();
    startLive();
  }

  /* ------------------------------ 标的表 ------------------------------ */
  async function ensureUniverse() {
    if (state.universe.length) return state.universe;
    state.prog.stage = '拉取标的列表（新浪：ETF + 沪深A股）…';
    state.prog.done = 0; state.prog.total = 0;
    renderStatus();
    try {
      var list = await W.fetchUniverse(function (n) {
        state.prog.stage = '拉取标的列表… ' + n + ' 只';
        renderStatus();
      });
      state.universe = list;
      state.prog.stage = '标的 ' + list.length + ' 只（已剔债券、货币、ST/退市）';
    } catch (e) {
      state.prog.stage = '标的列表拉取失败：' + e.message;
      throw e;
    }
    return state.universe;
  }

  /* ------------------------------ 扫描 ------------------------------ */
  async function startScan() {
    if (state.running) return;
    state.running = true;
    state.cancelled = false;
    state.hits = [];
    state.live = {}; state.wkLive = {}; state.dyLive = {}; state.liveAt = null;
    state.updatedAt = null;
    state.prog = { done: 0, total: 0, failed: 0, gaps: 0, stage: '准备标的列表…' };
    render();

    try {
      var pool = await ensureUniverse();
      if (state.cancelled) { state.prog.stage = '已取消'; return; }
      state.prog.stage = '探测数据源…';
      renderStatus();
      var pr = await W.probe();
      state.prog.stage = pr.ok ? '数据源：腾讯前复权' : '数据源：新浪（腾讯不可用，退回不复权日线）';
      state.universeSize = pool.length;
      state.prog.total = pool.length;
      state.prog.stage = '扫描日线 / 周线…';
      render();

      var started = Date.now();
      var res = await W.scan(pool, {
        cancelled: function () { return state.cancelled; },
        abort: function () { state.cancelled = true; },
        onTick: function (done, total, failed, gaps) {
          state.prog.done = done; state.prog.total = total;
          state.prog.failed = failed; state.prog.gaps = gaps;
          state.prog.stage = '扫描日线 / 周线… ' + done + '/' + total;
          renderStatus();
        }
      });

      // 传输失败的补一轮：失败往往集中在几次抖动上，不补会让几十只标的凭空消失
      if (res.failedFunds && res.failedFunds.length && !state.cancelled) {
        state.prog.stage = '补取 ' + res.failedFunds.length + ' 只…';
        renderStatus();
        var again = await W.scan(res.failedFunds, {
          cancelled: function () { return state.cancelled; },
          onTick: function (d) { state.prog.stage = '补取 ' + d + '/' + res.failedFunds.length; renderStatus(); }
        });
        res.found = res.found.concat(again.found);
        res.all = (res.all || []).concat(again.all || []);
        res.failed = again.failed;
        res.gaps += again.gaps;
      }

      var hits = res.found;
      hits.sort(byWeekRedThenAmount);
      state.hits = hits;
      state.updatedAt = new Date();
      state.prog.failed = res.failed;
      state.prog.gaps = res.gaps;
      state.prog.done = state.prog.total;
      state.prog.stage = state.cancelled
        ? '已取消，保留已扫到的 ' + hits.length + ' 只'
        : '扫描完成，命中 ' + hits.length + ' 只' + (res.gaps ? '（' + res.gaps + ' 只数据不足跳过）' : '') +
          '，用时 ' + Math.round((Date.now() - started) / 1000) + ' 秒';

      if (!state.cancelled) {
        W.saveCache(hits, state.universeSize, state.updatedAt);
        state.hist = W.recordRound(state.hist, hits, state.updatedAt);
        W.saveHist(state.hist);
      }
      recalcLive();
    } catch (e) {
      state.prog.stage = '出错：' + e.message;
    } finally {
      state.running = false;
      render();
      startLive(true);
    }
  }

  /** 只重算已命中的标的，不重拉全市场名单 */
  async function refreshHits() {
    if (state.running || !state.hits.length) return;
    state.running = true;
    state.cancelled = false;
    var snapshot = state.hits.slice();
    state.prog = { done: 0, total: snapshot.length, failed: 0, gaps: 0, stage: '重算已命中 ' + snapshot.length + ' 只…' };
    render();
    // 必须有 finally：中途抛错若把 state.running 留在 true，按钮卡死、5 秒轮询也会停摆
    try {
      await W.probe();

      var res = await W.scan(snapshot.map(function (h) { return h.fund; }), {
        cancelled: function () { return state.cancelled; },
        onTick: function (done, total, failed, gaps) {
          state.prog.done = done; state.prog.failed = failed; state.prog.gaps = gaps;
          state.prog.stage = '重算已命中 ' + done + '/' + total;
          renderStatus();
        }
      });

      // 取数失败的沿用旧结果，不丢标的；取到数的按新结果判断红绿
      var byCode = {};
      (res.all || res.found).forEach(function (h) { byCode[h.fund.code] = h; });
      var updated = [];
      snapshot.forEach(function (old) {
        var h = byCode[old.fund.code] || old;
        if (h.weekly && h.weekly.isRed) updated.push(h);
      });
      updated.sort(byWeekRedThenAmount);
      state.hits = updated;
      state.updatedAt = new Date();
      state.wkLive = {}; state.dyLive = {};
      state.prog.stage = '重算完成，' + updated.length + ' 只仍为周线红';
      W.saveCache(updated, state.universeSize, state.updatedAt);
      recalcLive();
    } catch (e) {
      state.prog.stage = '重算出错：' + e.message;
    } finally {
      state.running = false;
      render();
      startLive(true);
    }
  }

  /** 命中列表统一排序：连红少的在前，同档成交额大的在前 */
  function byWeekRedThenAmount(a, b) {
    var r = a.weekRed - b.weekRed;
    return r !== 0 ? r : b.fund.amount - a.fund.amount;
  }

  /* ------------------------------ 盘中实时 ------------------------------ */
  function startLive(immediate) {
    if (state.liveTimer) return;
    state.liveTimer = setInterval(tickLive, W.TICK_MS);
    if (immediate !== false) tickLive();
  }

  async function tickLive() {
    if (state.liveBusy || state.running) return;
    var now = new Date();
    if (!W.isTrading(now)) return;
    if (state.liveRetryAfter && now.getTime() < state.liveRetryAfter) return;

    var map = new Map();
    state.hits.forEach(function (h) { map.set(h.fund.code, h.fund); });
    state.watch.forEach(function (f) { if (!map.has(f.code)) map.set(f.code, f); });
    if (!map.size) return;

    state.liveBusy = true;
    try {
      var q = await W.fetchQuotes(Array.from(map.values()));
      if (!Object.keys(q).length) return;
      state.live = q;
      state.liveAt = new Date();
      state.liveRetryAfter = 0;
      var flipped = recalcLive();
      if (state.detail) refreshDetailLive();
      if (flipped) renderList(); else updateLivePrices();
      renderStatus();
    } catch (e) {
      state.liveRetryAfter = Date.now() + 30000;
    } finally {
      state.liveBusy = false;
    }
  }

  /** 用实时价重算命中标的的周线 / 日线趋势 */
  function recalcLive() {
    if (!state.hits.length) return false;
    var now = new Date();
    var stale = weekStale();
    var flipped = false;
    var redMap = {};
    state.hits.forEach(function (h) {
      var q = state.live[h.fund.code];
      if (!q || !(q.price > 0)) return;
      var w = stale ? h.weekly
        : (h.weekPartial ? (W.trendWithLive(h.wCloses, q.price) || h.weekly) : h.weekly);
      if (w) {
        state.wkLive[h.fund.code] = w;
        redMap[h.fund.code] = w.isRed;
        if (state._redMap && state._redMap[h.fund.code] !== w.isRed) flipped = true;
      }

      var dl = h.dLast ? W.d2(h.dLast) : null;
      if (dl && W.sameDay(dl, now) && h.dCloses && h.dCloses.length) {
        var t = W.analyzeSeries(h.dCloses.slice(-120), q.price, false) || h.daily;
        if (t) state.dyLive[h.fund.code] = t;
      }
    });
    state._redMap = redMap;
    return flipped;
  }

  /** 现价每 5 秒变一次，只改数值不重建整张列表（近千张卡重建会卡） */
  function updateLivePrices() {
    var cards = $('list').children;
    var now = new Date();
    var staleWeek = weekStale(), staleDay = daysOld() > 0;
    for (var i = 0; i < cards.length; i++) {
      var el = cards[i];
      if (!el.getAttribute || !el.getAttribute('data-code')) continue;
      var code = el.getAttribute('data-code');
      var q = liveQuote(code, now);
      if (!q) continue;
      var cls = W.pctClass(q.pct);
      var px = el.querySelector('[data-k="px"]');
      var pct = el.querySelector('[data-k="pct"]');
      if (px) { px.textContent = q.price.toFixed(3); px.className = 'px ' + cls; }
      if (pct) { pct.textContent = (q.pct >= 0 ? '+' : '') + q.pct.toFixed(2) + '%'; pct.className = 'pct ' + cls; }
      var w = state.wkLive[code];
      if (w) {
        var wkp = el.querySelector('[data-k="wkp"]');
        var wlv = el.querySelector('[data-k="wlv"]');
        if (wkp) { wkp.textContent = '本周 ' + (w.weekPct >= 0 ? '+' : '') + w.weekPct.toFixed(2) + '%'; wkp.className = 'wkp ' + W.pctClass(w.weekPct); }
        if (wlv) wlv.textContent = '周线 ' + w.value.toFixed(3);
        var pw = el.querySelector('[data-k="pw"]');
        if (pw && !staleWeek) {
          pw.className = 'pill ' + (w.isRed ? 'up' : 'dn');
          pw.textContent = w.isRed ? '周' + w.redWeeks : '周';
        }
      }
      var d = state.dyLive[code];
      if (d) {
        var pd = el.querySelector('[data-k="pd"]');
        if (pd && !staleDay) {
          pd.className = 'pill ' + (d.isRed ? 'up' : 'dn');
          pd.textContent = d.isRed ? '日' + d.redWeeks : '日';
        }
      }
    }
  }

  /* ------------------------------ 详情页 ------------------------------ */
  /** 详情页的数据容器：打开、左右切换、搜索进入共用一份结构 */
  function makeDetail(rows, index) {
    return {
      rows: rows, index: index, week: true, selW: null, selD: null,
      rawDay: null, dayBars: [], weekBars: [], tDay: null, tWeek: null,
      partialWeek: false, closedDay: null, loading: true, err: null
    };
  }

  function openDetail(index) {
    var rows = state._rows || [];
    if (!rows.length || index < 0 || index >= rows.length) return;
    state.detail = makeDetail(rows.slice(), index);
    chartState.sel = null;
    chartState.view = { count: 0, end: 0 };   // 打开详情：根数交给 drawChart 按宽度定
    $('detail').classList.remove('hidden');
    renderDetail();
    loadDetail();
  }

  function closeDetail() {
    state.detail = null;
    $('detail').classList.add('hidden');
  }

  async function loadDetail() {
    var d = state.detail;
    if (!d) return;
    var row = d.rows[d.index];
    var fund = row.fund;
    d.loading = true; d.err = null;
    renderDetail();
    try {
      var r = await W.fetchBoth(fund, new Date());
      if (!state.detail || state.detail !== d) return;
      if (d.rows[d.index].fund.code !== fund.code) return;
      d.rawDay = r.daily;
      d.loading = false;
      rebuildDetail();
      renderDetail();
    } catch (e) {
      if (!state.detail || state.detail !== d) return;
      d.loading = false;
      d.err = '取数失败：' + e.message;
      renderDetail();
    }
  }

  /** 合并实时价 → 日线 / 周线 → 两个级别的趋势 */
  function rebuildDetail() {
    var d = state.detail;
    if (!d || !d.rawDay) return;
    var now = new Date();
    var row = d.rows[d.index];
    var q = liveQuote(row.fund.code, now);
    var liveOn = W.isTrading(now) && !!q;

    var dayBars = liveOn ? W.mergeLiveBar(d.rawDay, q, now) : d.rawDay;
    var weekAll = W.aggregateWeekly(dayBars);
    var closed = W.dropUnclosedWeek(weekAll, now);

    d.liveOn = liveOn;
    d.quote = q;
    d.dayBars = dayBars;
    d.weekBars = weekAll;
    d.partialWeek = weekAll.length > closed.length;
    d.tDay = W.analyzeBars(dayBars);
    d.tWeek = W.analyzeBars(weekAll);
    d.closedDay = W.analyzeBars(W.dropUnclosedDay(d.rawDay, now));
  }

  function refreshDetailLive() {
    var d = state.detail;
    if (!d || !d.rawDay) return;
    rebuildDetail();
    renderDetail();
  }

  function detailNav(delta) {
    var d = state.detail;
    var n = d.index + delta;
    if (n < 0 || n >= d.rows.length) return;
    d.index = n; d.rawDay = null; d.dayBars = []; d.weekBars = [];
    d.tDay = d.tWeek = null; d.selW = d.selD = null; d.err = null;
    renderDetail();
    loadDetail();
  }

  function renderDetail() {
    var d = state.detail;
    if (!d) return;
    var row = d.rows[d.index];
    var f = row.fund;
    var starred = starCodes().has(f.code);

    $('dName').textContent = f.name;
    $('dMeta').innerHTML = W.esc(f.code) + ' · ' + W.esc(f.kind) + ' · <b>' + (d.index + 1) + '/' + d.rows.length + '</b>';
    $('dPrev').disabled = d.index === 0;
    $('dPrev').style.opacity = d.index === 0 ? .3 : 1;
    $('dNext').disabled = d.index === d.rows.length - 1;
    $('dNext').style.opacity = d.index === d.rows.length - 1 ? .3 : 1;
    $('dStar').classList.toggle('on', starred);

    var tw = d.tWeek, td = d.tDay;
    var cw = $('chipW'), cd = $('chipD');
    cw.className = 'lvchip ' + (tw ? (tw.isRed ? 'up' : 'dn') : '');
    cw.textContent = '周线 ' + (tw ? (tw.isRed ? '红' : '绿') : '--');
    cd.className = 'lvchip ' + (td ? (td.isRed ? 'up' : 'dn') : '');
    cd.textContent = '日线 ' + (td ? (td.isRed ? '红' : '绿') : '--');
    $('tagPartial').classList.toggle('hidden', !d.partialWeek);
    $('tagLive').classList.toggle('hidden', !d.liveOn);

    $('tabW').classList.toggle('on', d.week);
    $('tabD').classList.toggle('on', !d.week);

    if (d.loading && !d.dayBars.length) {
      $('tip').textContent = '加载中…';
      $('tip').classList.remove('hidden');
      $('dPanel').innerHTML = '';
      clearCanvas();
      return;
    }
    if (d.err) {
      $('tip').textContent = d.err;
      $('tip').classList.remove('hidden');
      $('dPanel').innerHTML = '';
      clearCanvas();
      return;
    }
    $('tip').classList.add('hidden');
    drawChart();
    renderPanel();
  }

  function renderPanel() {
    var d = state.detail, row = d.rows[d.index], f = row.fund;
    var q = d.quote;
    var now = new Date();
    var price = q ? q.price : f.price;
    var pct = q ? q.pct : f.pct;
    var tw = d.tWeek, td = d.tDay;
    var weekIsCurrent = d.weekBars.length &&
      W.monday0(W.d2(d.weekBars[d.weekBars.length - 1].d)).getTime() === W.monday0(now).getTime();

    var rows = [];
    function row2(k, v, cls) {
      rows.push('<div class="prow"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>');
    }
    row2('现价', price > 0 ? price.toFixed(3) : '--', W.pctClass(pct));
    row2('当日涨跌', (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%', W.pctClass(pct));
    row2(weekIsCurrent ? '本周涨跌' : '上周涨跌',
      tw ? (tw.weekPct >= 0 ? '+' : '') + tw.weekPct.toFixed(2) + '%' : '--',
      tw ? W.pctClass(tw.weekPct) : '');
    if (d.liveOn) row2('刷新时间', hms(state.liveAt || now), 't2');
    rows.push('<div class="pdiv"></div>');
    row2('周线趋势', tw ? tw.value.toFixed(3) : '--', tw ? W.pctClass(tw.isRed ? 1 : -1) : '');
    row2('周线连红', tw ? tw.redWeeks + ' 周' : '--', tw ? W.pctClass(tw.isRed ? 1 : -1) : '');
    row2('日线趋势', td ? td.value.toFixed(3) : '--', td ? W.pctClass(td.isRed ? 1 : -1) : '');
    row2('日线连红', td ? td.redWeeks + ' 天' : '--', td ? W.pctClass(td.isRed ? 1 : -1) : '');
    if (d.liveOn && d.closedDay) {
      row2('日线（昨收）', (d.closedDay.isRed ? '红' : '绿') + ' · ' + d.closedDay.value.toFixed(3),
        W.pctClass(d.closedDay.isRed ? 1 : -1));
    }
    rows.push('<div class="pdiv"></div>');
    row2('周线乖离', tw ? (tw.bias >= 0 ? '+' : '') + tw.bias.toFixed(2) + '%' : '--', tw ? W.pctClass(tw.bias) : '');
    row2('成交额', W.fmtAmount(q ? q.amount : f.amount));
    if (d.weekBars.length) {
      row2(d.partialWeek ? '最新周 K（本周）' : '最新周 K', d.weekBars[d.weekBars.length - 1].d);
    }
    $('dPanel').innerHTML = rows.join('');
  }

  /* ------------------------------ K 线绘制 ------------------------------ */
  var VIEW_MIN = 20;   // 缩放下限：最少显示 20 根
  var chartState = { sel: null, view: { count: 0, end: 0 }, slot: 6 };

  function clampN(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /** 当前视图窗口 [start, end)，并把越界的 count/end 规范回来；def 为未初始化时的默认根数 */
  function chartView(bars, def) {
    var total = bars ? bars.length : 0;
    if (!total) { chartState.view.count = 0; chartState.view.end = 0; return { start: 0, end: 0, count: 0 }; }
    var c = clampN(chartState.view.count || def || 60, VIEW_MIN, total);
    var e = clampN(chartState.view.end || total, c, total);
    chartState.view.count = c; chartState.view.end = e;
    return { start: e - c, end: e, count: c };
  }

  /** 切换标的 / 周日后重置：count 交 0 表示按绘图区宽度重新定 */
  function resetChartView(bars, def) {
    var total = bars ? bars.length : 0;
    chartState.view.count = def ? Math.min(def, total) : 0;
    chartState.view.end = total;
  }

  /** 缩放：factor<1 放大；anchor 为需要钉住的 K 线下标 */
  function zoomChart(factor, anchor) {
    var cs = chartBars(), bars = cs.bars;
    if (!bars.length) return;
    var v = chartView(bars);
    var next = clampN(Math.round(v.count * factor), VIEW_MIN, bars.length);
    if (next === v.count) return;
    var ai = anchor == null ? (v.end - v.count / 2) : anchor;
    var frac = v.count ? clampN((ai - v.start) / v.count, 0, 1) : 0.5;
    var newEnd = clampN(Math.round(ai - frac * next + next), next, bars.length);
    chartState.view.count = next;
    chartState.view.end = newEnd;
    drawChart();
  }

  /** 平移：把窗口右端移到 targetEnd（绝对下标，按拖拽起点算，避免累积误差） */
  function panTo(targetEnd) {
    var cs = chartBars(), bars = cs.bars;
    if (!bars.length) return;
    var v = chartView(bars);
    var e = clampN(Math.round(targetEnd), v.count, bars.length);
    if (e === v.end) return;
    chartState.view.end = e;
    drawChart();
  }

  function clearCanvas() {
    var cv = $('chart');
    var ctx = cv.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
  }

  function chartBars() {
    var d = state.detail;
    if (!d) return { bars: [], line: [], partial: false, week: true };
    if (d.week) {
      return { bars: d.weekBars, line: d.tWeek ? d.tWeek.line : [], partial: d.partialWeek, week: true };
    }
    return { bars: d.dayBars, line: d.tDay ? d.tDay.line : [], partial: false, week: false };
  }

  function fmtVol(v) {
    if (!(v > 0)) return '--';
    if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿';
    if (v >= 1e4) return (v / 1e4).toFixed(0) + '万';
    return String(Math.round(v));
  }

  function drawChart() {
    var cv = $('chart'), box = cv.parentElement;
    var rect = box.getBoundingClientRect();
    var w = Math.max(160, rect.width - 12);
    var h = Math.max(150, rect.height - 12);
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cs = chartBars(), bars = cs.bars, line = cs.line;
    if (!bars.length) return;

    var padL = 4, padR = 52, padT = 30, padB = 16, gap = 8;
    var innerH = h - padT - padB - gap;
    var volH = Math.round(Math.max(34, innerH * 0.24));
    var priceH = innerH - volH;
    var pw = w - padL - padR;
    if (pw < 40 || priceH < 40) return;

    // ---- 视图窗口（可缩放 / 平移）----
    // 默认根数按绘图区宽度定：保证每根约 8px，实体才够宽做出空心效果（对齐参考稿的 fitCount）
    var vw = chartView(bars, clampN(Math.round(pw / 8), 36, 60));
    var start = vw.start, n = vw.count, total = bars.length;
    var slot = pw / n;
    chartState.slot = slot;
    var bodyW = Math.min(13, Math.max(2, slot * 0.75));
    var bw = Math.max(2, Math.round(bodyW));   // 整像素宽；成交量柱也用它，保证与 K 线同宽对齐

    var lo = Infinity, hi = -Infinity, vmax = 0;
    for (var i = start; i < vw.end; i++) {
      var b = bars[i];
      lo = Math.min(lo, b.l); hi = Math.max(hi, b.h);
      if (b.v > vmax) vmax = b.v;
      if (i < line.length && line[i] > 0) { lo = Math.min(lo, line[i]); hi = Math.max(hi, line[i]); }
    }
    if (!isFinite(lo) || !isFinite(hi)) return;
    if (hi - lo < 1e-6) hi = lo + 0.001;
    var top = hi + (hi - lo) * 0.04, bot = lo - (hi - lo) * 0.04;
    var dec = hi >= 1000 ? 1 : (hi >= 10 ? 2 : 3);
    var Y = function (v) { return padT + (top - v) / (top - bot) * priceH; };
    var X = function (i) { return padL + (i - start + 0.5) * slot; };
    var volBottom = padT + priceH + gap + volH;
    var volTop = function (v) { return volBottom - (vmax ? (v / vmax) : 0) * (volH - 2); };

    var FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';

    // ---- 网格 + 右侧价格刻度 ----
    ctx.font = '9px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    for (var g = 0; g <= 4; g++) {
      var gy = padT + priceH * g / 4;
      ctx.strokeStyle = g === 4 ? '#2A3035' : '#1C2125';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL + pw, gy); ctx.stroke();
      ctx.fillStyle = '#6E757B';
      ctx.fillText((top - (top - bot) * g / 4).toFixed(dec), padL + pw + 6, gy);
    }

    // ---- 纵向网格（与日期刻度对齐）----
    var ticks = [0, Math.round(n / 3), Math.round(n * 2 / 3), n - 1];
    ctx.strokeStyle = '#191D21'; ctx.lineWidth = 0.8;
    for (var t = 0; t < ticks.length; t++) {
      var ii = start + ticks[t];
      if (ii < start || ii >= bars.length) continue;
      var tx = X(ii);
      ctx.beginPath(); ctx.moveTo(tx, padT); ctx.lineTo(tx, padT + priceH); ctx.stroke();
    }

    // ---- 成交量副图 ----
    var VOL_UP = 'rgba(226,75,74,.75)', VOL_DN = 'rgba(31,169,122,.75)';
    ctx.fillStyle = '#5A6167';
    ctx.textAlign = 'left';
    ctx.fillText('成交量', padL + 1, padT + priceH + gap + 5);
    for (var v = start; v < vw.end; v++) {
      var vb = bars[v];
      if (!(vb.v > 0)) continue;
      var vy = volTop(vb.v);
      ctx.fillStyle = vb.c >= vb.o ? VOL_UP : VOL_DN;
      ctx.fillRect(Math.round(X(v) - bw / 2), vy, bw, volBottom - vy);
    }
    ctx.strokeStyle = '#2A3035'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(padL, padT + priceH + gap - 1); ctx.lineTo(padL + pw, padT + priceH + gap - 1); ctx.stroke();

    // ---- K 线（阳线空心、阴线实心；坐标对齐像素，否则细框会被抗锯齿糊成实心）----
    for (var j = start; j < vw.end; j++) {
      var bar = bars[j];
      var up = bar.c >= bar.o;
      var col = up ? '#E24B4A' : '#1FA97A';
      var partial = cs.partial && j === total - 1;
      var cx = X(j);

      var yTop = Math.round(Y(Math.max(bar.o, bar.c)));
      var bh = Math.max(1, Math.round(Math.abs(Y(bar.c) - Y(bar.o))));
      var bx = Math.round(cx - bw / 2);
      var xr = bx + Math.floor(bw / 2) + 0.5;   // 影线落在这根的正中列

      // 影线拆成上下两段，到实体边缘为止：整根画穿过去，空心体里会留一条竖线
      ctx.strokeStyle = partial ? hexA(col, 0.65) : col;
      ctx.lineWidth = 1;
      var yHigh = Math.round(Y(bar.h)) + 0.5, yLow = Math.round(Y(bar.l)) + 0.5;
      var yEdgeT = yTop + 0.5, yEdgeB = yTop + bh - 0.5;
      ctx.beginPath();
      if (yHigh < yEdgeT) { ctx.moveTo(xr, yHigh); ctx.lineTo(xr, yEdgeT); }
      if (yLow > yEdgeB) { ctx.moveTo(xr, yEdgeB); ctx.lineTo(xr, yLow); }
      ctx.stroke();

      if (partial) {
        ctx.fillStyle = hexA(col, 0.28);
        ctx.fillRect(bx, yTop, bw, bh);
        ctx.strokeStyle = col; ctx.setLineDash([2, 2]); ctx.lineWidth = 1;
        ctx.strokeRect(bx + 0.5, yTop + 0.5, bw - 1, bh - 1);
        ctx.setLineDash([]);
      } else if (up && bw >= 4 && bh > 2) {
        // 阳线空心：体宽不足 4px 时框内只剩一条缝，反而看不清，回落实心
        ctx.strokeStyle = col; ctx.lineWidth = 1;
        ctx.strokeRect(bx + 0.5, yTop + 0.5, bw - 1, bh - 1);
      } else {
        ctx.fillStyle = col;
        ctx.fillRect(bx, yTop, bw, bh);
      }
    }

    // ---- 主趋势线（逐段上色）----
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var lineEnd = Math.min(vw.end, line.length);
    for (var m = Math.max(start + 1, 1); m < lineEnd; m++) {
      var prev = line[m - 1], cur = line[m];
      ctx.strokeStyle = cur > prev ? '#E24B4A' : '#1FA97A';
      if (cs.partial && m === line.length - 1 && vw.end === total) {
        dashLine(ctx, X(m - 1), Y(prev), X(m), Y(cur));
      } else {
        ctx.beginPath(); ctx.moveTo(X(m - 1), Y(prev)); ctx.lineTo(X(m), Y(cur)); ctx.stroke();
      }
    }

    // ---- 最新价虚线 + 右侧价签（只在视图含末根时画）----
    var atTail = (vw.end === total);
    var lastBar = bars[total - 1];
    var lastY = Y(lastBar.c);
    var lastCol = lastBar.c >= lastBar.o ? '#E24B4A' : '#1FA97A';
    if (atTail) {
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = hexA(lastCol, 0.5);
      ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(padL, lastY); ctx.lineTo(padL + pw, lastY); ctx.stroke();
      ctx.setLineDash([]);
    }

    // ---- 十字光标 ----
    var si = chartState.sel == null ? total - 1 : chartState.sel;
    si = Math.max(start, Math.min(total - 1, si));
    // 光标停在末根时只画一个价签，避免两个标签叠在一起
    if (atTail && si !== total - 1) tagRight(ctx, lastY, lastBar.c.toFixed(dec), lastCol, w, padL + pw);
    var sx = X(si), sy = Y(bars[si].c);
    ctx.strokeStyle = 'rgba(255,255,255,.34)';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(sx, padT); ctx.lineTo(sx, volBottom); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, sy); ctx.lineTo(padL + pw, sy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, Math.PI * 2); ctx.fill();
    tagRight(ctx, sy, bars[si].c.toFixed(dec), '#3E464D', w, padL + pw);
    tagBottom(ctx, sx, bars[si].d.slice(5).replace('-', '/'), padL, padL + pw, volBottom + 1);

    // ---- 底部日期刻度 ----
    ctx.fillStyle = '#6E757B';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var d2i = 0; d2i < ticks.length; d2i++) {
      var idx = start + ticks[d2i];
      if (idx >= bars.length) continue;
      var lx = Math.min(Math.max(X(idx), padL + 16), padL + pw - 16);
      if (Math.abs(lx - sx) < 26) continue;   // 与光标日期签重叠就不画
      var label = cs.week ? bars[idx].d.slice(2, 7).replace('-', '/') : bars[idx].d.slice(5).replace('-', '/');
      ctx.fillText(label, lx, h - 6);
    }

    // ---- 顶部信息 ----
    renderChartInfo(ctx, bars, line, si, dec, padL + 2);
  }

  function renderChartInfo(ctx, bars, line, i, dec, x0) {
    var b = bars[i], prev = i > 0 ? bars[i - 1] : null;
    var pct = (!prev || !prev.c) ? 0 : (b.c - prev.c) / prev.c * 100;
    var col = pct > 0 ? '#E24B4A' : (pct < 0 ? '#1FA97A' : '#9AA0A6');
    ctx.font = '9.5px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    function segs(arr, x, y) {
      for (var k = 0; k < arr.length; k++) {
        ctx.fillStyle = arr[k][1];
        ctx.fillText(arr[k][0], x, y);
        x += ctx.measureText(arr[k][0]).width;
      }
    }

    var p = function (v) { return v.toFixed(dec); };
    segs([
      [b.d + '  ', '#9AA0A6'],
      ['开', '#6E757B'], [p(b.o) + '  ', '#D5D9DC'],
      ['高', '#6E757B'], [p(b.h) + '  ', '#D5D9DC'],
      ['低', '#6E757B'], [p(b.l) + '  ', '#D5D9DC'],
      ['收', '#6E757B'], [p(b.c), col]
    ], x0, 9);

    var tv = i < line.length ? line[i] : null;
    var tprev = i > 0 && i - 1 < line.length ? line[i - 1] : null;
    var tcol = (tv != null && tprev != null) ? (tv > tprev ? '#E24B4A' : '#1FA97A') : '#9AA0A6';
    var seg2 = [
      [(pct >= 0 ? '+' : '') + pct.toFixed(2) + '%  ', col],
      [b.a > 0 ? '额 ' : '量 ', '#6E757B'],
      [b.a > 0 ? W.fmtAmount(b.a) : fmtVol(b.v), '#D5D9DC']
    ];
    if (tv != null) seg2.push(['  趋势 ', '#6E757B'], [tv.toFixed(dec), tcol]);
    segs(seg2, x0, 22);
  }

  function tagRight(ctx, y, text, bg, w, rightEdge) {
    ctx.font = '9px -apple-system,sans-serif';
    var tw = ctx.measureText(text).width + 8;
    var x = rightEdge + 3;
    ctx.fillStyle = bg;
    ctx.fillRect(x, y - 7, Math.min(tw, w - x - 1), 14);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 4, y);
  }

  function tagBottom(ctx, x, text, left, right, y) {
    ctx.font = '9px -apple-system,sans-serif';
    var tw = ctx.measureText(text).width + 10;
    var bx = Math.min(Math.max(x - tw / 2, left), right - tw);
    ctx.fillStyle = 'rgba(62,70,77,.95)';
    ctx.fillRect(bx, y + 1, tw, 13);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, bx + tw / 2, y + 8);
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function dashLine(ctx, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (len <= 0) return;
    var ux = dx / len, uy = dy / len, t = 0;
    ctx.beginPath();
    while (t < len) {
      var e = Math.min(t + 3, len);
      ctx.moveTo(x1 + ux * t, y1 + uy * t);
      ctx.lineTo(x1 + ux * e, y1 + uy * e);
      t = e + 2;
    }
    ctx.stroke();
  }

  /* 横坐标 → K 线下标（按当前缩放窗口换算） */
  function chartIdxAt(clientX) {
    var cv = $('chart');
    var rect = cv.getBoundingClientRect();
    var x = clientX - rect.left;
    var cs = chartBars(), v = chartView(cs.bars);
    if (!v.count) return 0;
    return W.chartIndexAt(x, rect.width, v.end, v.count, 4, 52);
  }

  /* 点按 / 滑动选 K 线 */
  function pickAt(clientX) {
    var idx = chartIdxAt(clientX);
    chartState.sel = idx;
    if (state.detail) {
      if (state.detail.week) state.detail.selW = idx; else state.detail.selD = idx;
    }
    drawChart();
  }

  /* ------------------------------ 自选 ------------------------------ */
  function toggleStar(fund) {
    var i = -1;
    for (var k = 0; k < state.watch.length; k++) if (state.watch[k].code === fund.code) { i = k; break; }
    var added;
    if (i >= 0) { state.watch.splice(i, 1); added = false; }
    else {
      state.watch.push({
        code: fund.code, name: fund.name, market: fund.market, kind: fund.kind,
        price: fund.price, pct: fund.pct, amount: fund.amount, sym: W.txSymbol(fund)
      });
      added = true;
    }
    W.saveWatch(state.watch);
    toast(added ? '已加入自选：' + fund.name : '已从自选移除');
    render();
    if (state.detail) renderDetail();
  }

  function showSearchSheet() {
    var html = '<h3>搜索标的</h3>' +
      '<div class="searchbar"><input id="q" placeholder="输入代码或名称，如 510300 / 沪深300" autocomplete="off"></div>' +
      '<div class="sres" id="sres"><div class="empty" style="padding:30px">输入关键字开始搜索</div></div>';
    openSheet(html);
    var input = $('q');
    input.focus();

    function search(kw) {
      kw = kw.trim().toUpperCase();
      var box = $('sres');
      if (!kw) { box.innerHTML = '<div class="empty" style="padding:30px">输入关键字开始搜索</div>'; return; }
      var out = [];
      for (var i = 0; i < state.universe.length && out.length < 60; i++) {
        var f = state.universe[i];
        if (f.code.indexOf(kw) >= 0 || f.name.toUpperCase().indexOf(kw) >= 0) out.push(f);
      }
      if (!out.length) {
        box.innerHTML = '<div class="empty" style="padding:30px">没找到。' +
          (state.universe.length ? '' : '标的表还未加载，先扫描一次或等列表拉完。') + '</div>';
        return;
      }
      box.innerHTML = out.map(function (f) {
        return '<div class="sitem" data-code="' + f.code + '"><span class="c">' + f.code + '</span>' +
          '<span class="n">' + W.esc(f.name) + '</span><span class="c" style="text-align:right">' + f.kind + '</span></div>';
      }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('.sitem'), function (el) {
        el.onclick = function () {
          var code = el.getAttribute('data-code');
          var f = state.universe.filter(function (x) { return x.code === code; })[0];
          if (!f) return;
          closeSheet();
          openSynthetic(f);
        };
      });
    }

    input.oninput = function () { search(input.value); };
    input.onkeydown = function (e) { if (e.key === 'Enter') search(input.value); };

    if (!state.universe.length) ensureUniverse().then(function () { search(input.value); }).catch(function () {});
  }

  /** 从搜索进入：不在当前筛选结果里也能看详情 */
  function openSynthetic(fund) {
    var rows = [{
      fund: fund, daily: null, weekly: null, weekPartial: false, wCloses: [],
      wSlope: 0, volRatio: 0, newHit: false, streak: 0, weekRed: 0, dayRed: 0,
      bias: 0, amount: fund.amount
    }];

    $('detail').classList.remove('hidden');
    renderDetail();
    loadDetail();
  }

  /* ------------------------------ 事件 ------------------------------ */
  function bind() {
    $('bSearch').onclick = showSearchSheet;
    $('bRefresh').onclick = function () { refreshHits(); };
    $('bStar').onclick = function () {
      state.starOnly = !state.starOnly;
      if (state.starOnly) { state.showDropped = false; }
      render();
    };
    $('bMore').onclick = showInfoSheet;
    $('srcBar').onclick = showSourceSheet;
    $('fab').onclick = function () {
      if (state.running) {
        state.cancelled = true;
        state.prog.stage = '正在停止…';
        renderStatus();
      } else {
        startScan();
      }
    };

    // 列表：卡片点击 + 星标
    $('list').addEventListener('click', function (e) {
      var card = e.target.closest('.card');
      if (!card) return;
      var code = card.getAttribute('data-code');
      var rows = state._rows || [];
      var idx = -1;
      for (var i = 0; i < rows.length; i++) if (rows[i].fund.code === code) { idx = i; break; }
      if (idx < 0) return;
      openDetail(idx);
    });

    // 筛选
    document.addEventListener('click', function (e) {
      var el = e.target.closest('.chip[data-act]');
      if (!el) return;
      var act = el.getAttribute('data-act');
      var v = el.getAttribute('data-v');
      if (act === 'kind') { state.kind = v; state.starOnly = false; state.showDropped = false; }
      if (act === 'star') { state.starOnly = !state.starOnly; state.showDropped = false; }
      if (act === 'amt') { state.minAmount = +v; }
      if (act === 'new') { state.onlyNew = !state.onlyNew; state.showDropped = false; }
      if (act === 'drop') { state.showDropped = !state.showDropped; state.onlyNew = false; }
      if (act === 'both') { state.bothRed = !state.bothRed; }
      if (act === 'red') { state.minRed = +v; }
      render();
    });

    // 详情
    $('dBack').onclick = closeDetail;
    $('dPrev').onclick = function () { detailNav(-1); };
    $('dNext').onclick = function () { detailNav(1); };
    $('dStar').onclick = function () {
      if (state.detail) toggleStar(state.detail.rows[state.detail.index].fund);
    };
    $('tabW').onclick = function () {
      if (!state.detail) return;
      state.detail.week = true; chartState.sel = state.detail.selW;
      resetChartView(state.detail.weekBars); renderDetail();
    };
    $('tabD').onclick = function () {
      if (!state.detail) return;
      state.detail.week = false; chartState.sel = state.detail.selD;
      resetChartView(state.detail.dayBars); renderDetail();
    };

    var cv = $('chart');
    var drag = null, pinch = null;

    function touchDist(e) {
      var a = e.touches[0], b = e.touches[1];
      return Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2)) || 1;
    }

    // 滚轮缩放，锚点锁在光标那根
    cv.addEventListener('wheel', function (e) {
      if (!chartBars().bars.length) return;
      e.preventDefault();
      zoomChart(e.deltaY > 0 ? 1.12 : 0.89, chartIdxAt(e.clientX));
    }, { passive: false });

    // 鼠标：按下选中，横向拖动超过阈值则平移（仅在有隐藏数据时）
    cv.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;    // 触摸走 touch 分支
      var cs = chartBars(), v = chartView(cs.bars);
      drag = { x: e.clientX, moved: false, end: v.end, pan: v.count < cs.bars.length };
      cv.setPointerCapture(e.pointerId);
      pickAt(e.clientX);
    });
    cv.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch' || !drag) return;
      var dx = e.clientX - drag.x;
      if (Math.abs(dx) > 6) drag.moved = true;
      if (!drag.moved) return;
      // 位移始终以按下时的窗口右端为基准，逐次叠加会越滑越快
      if (drag.pan) panTo(drag.end - dx / (chartState.slot || 6));
      else pickAt(e.clientX);
    });
    cv.addEventListener('pointerup', function (e) { if (e.pointerType !== 'touch') drag = null; });
    cv.addEventListener('pointercancel', function (e) { if (e.pointerType !== 'touch') drag = null; });

    // 触摸：单指点按选中 / 拖动平移，双指捏合缩放
    cv.addEventListener('touchstart', function (e) {
      var cs = chartBars();
      if (e.touches.length === 2) {
        var v0 = chartView(cs.bars);
        pinch = { d: touchDist(e), count: v0.count, center: v0.end - v0.count / 2 };
        drag = null;
      } else if (e.touches.length === 1) {
        var v = chartView(cs.bars);
        drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false, end: v.end, pan: v.count < cs.bars.length };
        pinch = null;
        pickAt(e.touches[0].clientX);
      }
    }, { passive: true });

    cv.addEventListener('touchmove', function (e) {
      var cs = chartBars();
      if (e.touches.length === 2 && pinch) {
        e.preventDefault();
        var d = touchDist(e);
        var v = chartView(cs.bars);
        var next = clampN(Math.round(pinch.count * (pinch.d / d)), VIEW_MIN, cs.bars.length);
        if (next === v.count) return;
        chartState.view.count = next;
        chartState.view.end = clampN(Math.round(pinch.center + next / 2), next, cs.bars.length);
        drawChart();
        return;
      }
      if (e.touches.length === 1 && drag) {
        var dx = e.touches[0].clientX - drag.x;
        var dy = e.touches[0].clientY - drag.y;
        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
        if (!drag.moved) return;
        e.preventDefault();
        if (drag.pan) panTo(drag.end - dx / (chartState.slot || 6));
        else pickAt(e.touches[0].clientX);
      }
    }, { passive: false });

    cv.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) pinch = null;
      if (e.touches.length === 0) { drag = null; return; }
      // 双指松成一指：用剩下这根重建基准，否则接着滑不动
      var cs2 = chartBars(), v2 = chartView(cs2.bars);
      drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: true,
               end: v2.end, pan: v2.count < cs2.bars.length };
    });

    // 弹层遮罩关闭
    $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });

    // 键盘
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { if (!$('sheet').classList.contains('hidden')) closeSheet(); else if (state.detail) closeDetail(); }
      if (state.detail) {
        if (e.key === 'ArrowLeft') detailNav(-1);
        if (e.key === 'ArrowRight') detailNav(1);
      }
    });

    // 切后台停轮询，回前台恢复并补一次
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (state.liveTimer) { clearInterval(state.liveTimer); state.liveTimer = null; }
      } else {
        startLive(true);
        render();
      }
    });

    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (state.detail) drawChart(); }, 120);
    });
  }

  /* ------------------------------ 入口 ------------------------------ */
  window.addEventListener('DOMContentLoaded', function () {
    if (location.hash === '#test') {
      var r = W.selftest();
      document.body.innerHTML = '<pre style="color:#ddd;padding:20px;font-size:13px">' +
        '自检 ' + (r.total - r.failed) + '/' + r.total + ' 通过\n' +
        (r.failed ? r.detail.join('\n') : '全部通过') + '</pre>';
      return;
    }
    bind();
    boot();
    // 调试入口：便于在控制台里检查状态（不影响正常使用）
    window.__WR = { state: state, render: render, openDetail: openDetail, startScan: startScan, fetchBoth: W.fetchBoth, hitOf: W.hitOf };
  });
})();
</script>
</body>
</html>
